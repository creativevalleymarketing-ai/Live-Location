<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Location</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;700&display=swap');
        body { font-family: 'Pyidaungsu', sans-serif; }
        #map { height: 100%; width: 100%; border-radius: 1.25rem; }
        
        /* Floating Heart Animation */
        .heart-particle {
            position: fixed;
            bottom: -50px;
            font-size: 24px;
            user-select: none;
            pointer-events: none;
            animation: floatUp 4s linear forwards;
            z-index: 9999;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-105vh) scale(1.4) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body class="bg-pink-50 text-gray-800 min-h-screen flex flex-col justify-between overflow-x-hidden">

    <!-- Container for Floating Hearts -->
    <div id="heartContainer"></div>

    <!-- Top Navigation Bar -->
    <nav class="bg-white/90 backdrop-blur-md border-b border-pink-100 sticky top-0 z-50 px-4 py-3 shadow-sm">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-2xl">📍</span>
                <h1 class="font-bold text-lg text-pink-700 tracking-tight">Live Location</h1>
            </div>
            
            <div class="flex items-center gap-2">
                <!-- Replay Heart Button (Only for Mee Mee / May Thu Hlaing) -->
                <button onclick="triggerLoveSurprise()" id="loveIconBtn" class="hidden text-xl bg-pink-100 hover:bg-pink-200 text-pink-600 p-1.5 rounded-full transition border border-pink-200 shadow-sm" title="Replay Hearts">
                    💖
                </button>
                
                <!-- Flag Language Switcher -->
                <button onclick="toggleLanguage()" id="flagBtn" class="text-xl bg-white hover:bg-pink-50 border border-pink-200 px-2.5 py-1 rounded-full shadow-sm transition">
                    🇬🇧
                </button>

                <!-- Logout Button -->
                <button onclick="logout()" id="logoutBtn" class="hidden text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-full font-bold transition">
                    <span data-i18n="logout">ထွက်မည်</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="max-w-md w-full mx-auto p-4 flex-1 flex flex-col justify-center">

        <!-- AUTHENTICATION FORM (SIGN UP & LOGIN) -->
        <section id="authScreen" class="bg-white p-6 rounded-3xl shadow-xl border border-pink-100 flex flex-col gap-4 my-auto">
            
            <!-- Form Header Tabs -->
            <div class="flex bg-pink-50 p-1 rounded-2xl border border-pink-100">
                <button id="tabLoginBtn" onclick="switchAuthTab('login')" class="flex-1 py-2 rounded-xl text-xs font-bold transition bg-white text-pink-700 shadow-sm" data-i18n="tabLogin">
                    အကောင့်ဝင်ရန်
                </button>
                <button id="tabSignupBtn" onclick="switchAuthTab('signup')" class="flex-1 py-2 rounded-xl text-xs font-bold transition text-gray-500 hover:text-pink-600" data-i18n="tabSignup">
                    အကောင့်သစ်ဖွင့်ရန်
                </button>
            </div>

            <!-- Auth Form -->
            <form onsubmit="handleAuthSubmit(event)" class="space-y-3">
                
                <!-- Name Field -->
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1" data-i18n="labelName">အမည် (Case-Sensitive)</label>
                    <input type="text" id="authName" required placeholder="ဥပမာ- Rainny သို့ May Thu Hlaing" class="w-full px-4 py-3 rounded-2xl bg-gray-50 border border-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-400 text-sm transition">
                </div>

                <!-- Gender Field -->
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1" data-i18n="labelGender">ကျား / မ ရွေးရန်</label>
                    <select id="authGender" required class="w-full px-4 py-3 rounded-2xl bg-gray-50 border border-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-400 text-sm transition">
                        <option value="Male" data-i18n="genderMale">ကျား (Male)</option>
                        <option value="Female" data-i18n="genderFemale">မ (Female)</option>
                    </select>
                </div>

                <!-- Password Field with Hide/Show Eye Icon -->
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1" data-i18n="labelPassword">လျှို့ဝှက်နံပါတ်</label>
                    <div class="relative">
                        <input type="password" id="authPassword" required placeholder="••••••••" class="w-full px-4 py-3 pr-10 rounded-2xl bg-gray-50 border border-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-400 text-sm transition">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-base">
                            👁️
                        </button>
                    </div>
                </div>

                <button type="submit" id="authSubmitBtn" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-2xl transition duration-200 shadow-lg shadow-pink-200 text-sm mt-2">
                    <span data-i18n="btnLogin">အကောင့်ဝင်မည်</span>
                </button>
            </form>
        </section>


        <!-- MAIN MAP & LIVE LOCATION DISPLAY SCREEN -->
        <section id="mapScreen" class="hidden flex flex-col gap-4">
            
            <!-- User Status Header -->
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-pink-100 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div id="userAvatarContainer" class="w-10 h-10 rounded-full bg-pink-100 flex items-center justify-center text-xl border border-pink-200 shadow-inner">
                        👤
                    </div>
                    <div>
                        <h3 id="displayUserName" class="font-bold text-sm text-gray-800">User</h3>
                        <p id="displayUserRole" class="text-xs text-pink-600 font-medium">Male</p>
                    </div>
                </div>
                <div id="statusBadge" class="text-xs bg-gray-100 text-gray-500 font-bold px-3 py-1 rounded-full">
                    <span data-i18n="statusStopped">ရပ်တန့်ထားသည်</span>
                </div>
            </div>

            <!-- Weather Card Widget -->
            <div id="weatherWidget" class="bg-gradient-to-r from-blue-500 to-indigo-600 text-white p-3.5 rounded-2xl shadow-md flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <span id="weatherIcon" class="text-3xl">🌤️</span>
                    <div>
                        <div class="flex items-center gap-2">
                            <span id="weatherTemp" class="font-bold text-lg">--°C</span>
                            <span id="weatherDesc" class="text-xs bg-white/20 px-2 py-0.5 rounded-full">ရာသီဥတု</span>
                        </div>
                        <p id="weatherForecast" class="text-xs opacity-90 mt-0.5">ရှာဖွေနေပါသည်...</p>
                    </div>
                </div>
            </div>

            <!-- Google Maps Style Location Search Bar -->
            <div class="bg-white p-2 rounded-2xl shadow-md border border-pink-100 flex items-center gap-2">
                <input type="text" id="searchInput" placeholder="မြန်မာပြည်တွင်း နေရာရှာရန် (ဥပမာ- ရန်ကုန်၊ မန္တလေး)" class="w-full px-3 py-2 text-xs rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-400">
                <button onclick="searchLocation()" class="bg-pink-600 hover:bg-pink-700 text-white text-xs font-bold px-4 py-2 rounded-xl transition shadow-sm whitespace-nowrap" data-i18n="btnSearch">
                    ရှာမည်
                </button>
            </div>

            <!-- Map View Area -->
            <div class="bg-white p-3 rounded-3xl shadow-md border border-pink-100 flex flex-col gap-3">
                <div class="h-80 relative overflow-hidden rounded-2xl shadow-inner">
                    <div id="map"></div>
                </div>

                <!-- Driving ETA & Distance Panel -->
                <div id="routeInfoPanel" class="hidden bg-pink-100/70 border border-pink-200 p-3 rounded-2xl text-xs flex items-center justify-between text-pink-900 font-medium">
                    <div class="flex items-center gap-2">
                        <span class="text-lg">🚗</span>
                        <div>
                            <p id="routeDistanceText" class="font-bold">အကွာအဝေး: - km</p>
                            <p id="routeEtaText" class="text-gray-600">ခန့်မှန်း ကြာချိန်: - min</p>
                        </div>
                    </div>
                    <button onclick="clearRoute()" class="text-xs bg-pink-200 hover:bg-pink-300 text-pink-800 px-2 py-1 rounded-lg font-bold">
                        ဖျက်မည်
                    </button>
                </div>

                <div class="bg-pink-50 p-3 rounded-2xl text-xs space-y-1">
                    <div class="flex justify-between text-gray-600">
                        <span data-i18n="coordinates">မိမိတည်နေရာ (Lat, Lon):</span>
                        <span id="coordsText" class="font-mono font-bold text-gray-800">-, -</span>
                    </div>
                </div>

                <!-- Save Home / Work Buttons -->
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="saveLocation('Home')" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-2 rounded-xl text-xs transition shadow-sm flex items-center justify-center gap-1">
                        🏠 <span data-i18n="btnSaveHome">Home မှတ်မည်</span>
                    </button>
                    <button onclick="saveLocation('Work')" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-xl text-xs transition shadow-sm flex items-center justify-center gap-1">
                        💼 <span data-i18n="btnSaveWork">Work မှတ်မည်</span>
                    </button>
                </div>

                <button onclick="toggleLocationSharing()" id="shareBtn" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-2xl transition duration-200 shadow-md">
                    <span data-i18n="btnStartShare">Live Location စတင်မျှဝေမည်</span>
                </button>
            </div>

            <!-- Active Users List -->
            <div class="bg-white p-4 rounded-3xl shadow-md border border-pink-100">
                <h3 class="font-bold text-sm text-gray-700 mb-3 flex items-center justify-between">
                    <span data-i18n="activeUsersTitle">👥 Map ပေါ်ရှိ သုံးစွဲသူများ</span>
                    <span id="userCount" class="bg-pink-100 text-pink-700 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
                </h3>
                <div id="userList" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                    <p class="text-xs text-gray-400 text-center py-4" data-i18n="searchingUsers">သုံးစွဲသူများ မရှိသေးပါ။</p>
                </div>
            </div>

        </section>

    </main>

    <!-- LOVE YOU POPUP MODAL (For Mee Mee / May Thu Hlaing) -->
    <div id="loveModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-3xl shadow-2xl text-center max-w-xs w-full border-4 border-pink-300 animate-bounce">
            <span class="text-6xl">💖</span>
            <h2 class="text-3xl font-bold text-pink-600 mt-2">Love You ❤️</h2>
            <p class="text-xs text-gray-500 mt-2">မေသူလှိုင် (Mee Mee) အတွက် အထူးသီးသန့် မေတ္တာဖြင့်...</p>
            <button onclick="closeLoveModal()" class="mt-5 w-full bg-pink-600 text-white font-bold py-2.5 rounded-2xl shadow-md hover:bg-pink-700 transition">
                ပိတ်မည် 💕
            </button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDLG2fJ3fRtBNNO0DhhRFbZoFdDGPRExn0",
            authDomain: "live-location-ea2df.firebaseapp.com",
            projectId: "live-location-ea2df",
            storageBucket: "live-location-ea2df.firebasestorage.app",
            messagingSenderId: "891244033984",
            appId: "1:891244033984:web:8e5ab090301d9f002cfa25",
            measurementId: "G-KVR7ZEFW1H"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // State Management
        let currentLang = localStorage.getItem('appLang') || 'my';
        let authMode = 'login'; // 'login' or 'signup'
        let watchId = null;
        let map = null;
        let markers = {};
        let currentUser = null;
        let routePolyline = null;
        let searchMarker = null;
        let userCurrentLat = null;
        let userCurrentLon = null;
        let notifiedProximity = {}; // Alert throttle
        let notifiedGeofence = {};  // Geofence alert throttle

        // Dictionary Translation
        const i18n = {
            my: {
                logout: "ထွက်မည်",
                tabLogin: "အကောင့်ဝင်ရန်",
                tabSignup: "အကောင့်သစ်ဖွင့်ရန်",
                labelName: "အမည် (Case-Sensitive)",
                labelGender: "ကျား / မ ရွေးရန်",
                labelPassword: "လျှို့ဝှက်နံပါတ်",
                genderMale: "ကျား (Male)",
                genderFemale: "မ (Female)",
                btnLogin: "အကောင့်ဝင်မည်",
                btnSignup: "အကောင့်သစ်ပြုလုပ်မည်",
                statusStopped: "ရပ်တန့်ထားသည်",
                statusSharing: "Live Location မျှဝေနေသည်",
                coordinates: "မိမိတည်နေရာ (Lat, Lon):",
                btnStartShare: "Live Location စတင်မျှဝေမည်",
                btnStopShare: "Live Location မျှဝေမှု ရပ်မည်",
                activeUsersTitle: "👥 Map ပေါ်ရှိ သုံးစွဲသူများ",
                searchingUsers: "သုံးစွဲသူများ မရှိသေးပါ။",
                btnView: "ကြည့်မည်",
                btnSearch: "ရှာမည်",
                btnSaveHome: "Home မှတ်မည်",
                btnSaveWork: "Work မှတ်မည်",
                youTag: "(မိမိ)"
            },
            en: {
                logout: "Logout",
                tabLogin: "Login",
                tabSignup: "Sign Up",
                labelName: "Name (Case-Sensitive)",
                labelGender: "Select Gender",
                labelPassword: "Password",
                genderMale: "Male",
                genderFemale: "Female",
                btnLogin: "Login",
                btnSignup: "Sign Up Now",
                statusStopped: "Stopped",
                statusSharing: "Sharing Live Location",
                coordinates: "My Coords (Lat, Lon):",
                btnStartShare: "Start Live Location",
                btnStopShare: "Stop Live Location",
                activeUsersTitle: "👥 Active Users on Map",
                searchingUsers: "No active users.",
                btnView: "View",
                btnSearch: "Search",
                btnSaveHome: "Save Home",
                btnSaveWork: "Save Work",
                youTag: "(You)"
            }
        };

        // Name Mapping Rule Helper
        function getDisplayName(rawName, viewerName) {
            if (rawName === 'May Thu Hlaing') return 'Mee Mee';
            if (rawName === 'Rainny' && viewerName === 'May Thu Hlaing') return 'Ko Ko';
            return rawName;
        }

        // Toggle Password Show/Hide
        window.togglePasswordVisibility = function() {
            const passInput = document.getElementById('authPassword');
            passInput.type = passInput.type === 'password' ? 'text' : 'password';
        };

        // Switch Auth Form Tabs
        window.switchAuthTab = function(mode) {
            authMode = mode;
            const loginBtn = document.getElementById('tabLoginBtn');
            const signupBtn = document.getElementById('tabSignupBtn');
            const submitBtn = document.getElementById('authSubmitBtn');

            if (mode === 'login') {
                loginBtn.className = "flex-1 py-2 rounded-xl text-xs font-bold transition bg-white text-pink-700 shadow-sm";
                signupBtn.className = "flex-1 py-2 rounded-xl text-xs font-bold transition text-gray-500 hover:text-pink-600";
                submitBtn.innerHTML = `<span data-i18n="btnLogin">${i18n[currentLang].btnLogin}</span>`;
            } else {
                signupBtn.className = "flex-1 py-2 rounded-xl text-xs font-bold transition bg-white text-pink-700 shadow-sm";
                loginBtn.className = "flex-1 py-2 rounded-xl text-xs font-bold transition text-gray-500 hover:text-pink-600";
                submitBtn.innerHTML = `<span data-i18n="btnSignup">${i18n[currentLang].btnSignup}</span>`;
            }
        };

        // Handle Auth (Sign Up / Login)
        window.handleAuthSubmit = async function(e) {
            e.preventDefault();
            const name = document.getElementById('authName').value.trim();
            const gender = document.getElementById('authGender').value;
            const pass = document.getElementById('authPassword').value.trim();

            if (!name || !pass) return;

            const userDocRef = doc(db, "users", name);

            if (authMode === 'signup') {
                const userSnap = await getDoc(userDocRef);
                if (userSnap.exists()) {
                    alert(currentLang === 'my' ? "ဤ အမည်ဖြင့် အကောင့်ရှိပြီးဖြစ်ပါသည်။ အကောင့်ဝင်ရန် ရွေးပါ!" : "Username already exists. Please login!");
                    return;
                }
                await setDoc(userDocRef, { name, gender, pass });
                alert(currentLang === 'my' ? "အကောင့်သစ် ဖွင့်လှစ်ခြင်း အောင်မြင်ပါသည်။" : "Sign up successful!");
            }

            // Login Check
            const userSnap = await getDoc(userDocRef);
            if (!userSnap.exists()) {
                alert(currentLang === 'my' ? "အကောင့်မရှိပါ။ Sign Up အရင်လုပ်ပါ!" : "User does not exist. Please sign up!");
                return;
            }

            const userData = userSnap.data();
            if (userData.pass !== pass || userData.gender !== gender) {
                alert(currentLang === 'my' ? "လျှို့ဝှက်နံပါတ် သို့မဟုတ် ကျား/မ အချက်အလက် မှားယွင်းနေပါသည်!" : "Incorrect password or gender!");
                return;
            }

            currentUser = {
                id: name,
                name: name,
                gender: gender,
                home: userData.home || null,
                work: userData.work || null
            };

            localStorage.setItem('locationUserSession', JSON.stringify(currentUser));
            showMapScreen();
        };

        // Screen Switch
        function showMapScreen() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mapScreen').classList.remove('hidden');
            document.getElementById('logoutBtn').classList.remove('hidden');

            const displayName = getDisplayName(currentUser.name, currentUser.name);
            document.getElementById('displayUserName').innerText = displayName;
            document.getElementById('displayUserRole').innerText = currentUser.gender;
            document.getElementById('userAvatarContainer').innerText = currentUser.gender === 'Female' ? '👩' : '👨';

            // Show Heart Icon Button if user is May Thu Hlaing / Mee Mee
            if (currentUser.name === 'May Thu Hlaing' || currentUser.name === 'Mee Mee') {
                document.getElementById('loveIconBtn').classList.remove('hidden');
                triggerLoveSurprise();
            }

            initMap();
            listenToFirestore();

            if (localStorage.getItem('isSharing') === 'true') {
                startSharing();
            }
        }

        window.logout = function() {
            stopSharing();
            localStorage.removeItem('locationUserSession');
            localStorage.removeItem('isSharing');
            currentUser = null;

            document.getElementById('mapScreen').classList.add('hidden');
            document.getElementById('logoutBtn').classList.add('hidden');
            document.getElementById('loveIconBtn').classList.add('hidden');
            document.getElementById('authScreen').classList.remove('hidden');
        };

        // Initialize Map
        function initMap() {
            if (map) return;
            map = L.map('map').setView([16.8661, 96.1951], 13);
            L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
                maxZoom: 20,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
                attribution: '© Google Maps'
            }).addTo(map);
        }

        // Save Home or Work Location
        window.saveLocation = async function(type) {
            if (!userCurrentLat || !userCurrentLon) {
                alert(currentLang === 'my' ? "ကျေးဇူးပြု၍ Location စတင်မျှဝေပါ သို့မဟုတ် တည်နေရာ ရယူပါ!" : "Please start location sharing first!");
                return;
            }
            const coords = { lat: userCurrentLat, lon: userCurrentLon };
            if (type === 'Home') currentUser.home = coords;
            if (type === 'Work') currentUser.work = coords;

            await setDoc(doc(db, "users", currentUser.name), { [type.toLowerCase()]: coords }, { merge: true });
            localStorage.setItem('locationUserSession', JSON.stringify(currentUser));
            alert(currentLang === 'my' ? `${type} တည်နေရာ သိမ်းဆည်းပြီးပါပြီ!` : `${type} location saved!`);
        };

        // Distance Calculator in Km & Miles
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c;
        }

        // Check Geofence Arrival for Rainny & May Thu Hlaing
        function checkGeofenceAlerts(targetUserDoc) {
            if (!currentUser || !userCurrentLat || !userCurrentLon) return;

            const myName = currentUser.name;
            const targetName = targetUserDoc.name;

            // Target user's Home/Work check
            if (targetUserDoc.home || targetUserDoc.work) {
                const locations = [
                    { type: 'အိမ်', coords: targetUserDoc.home },
                    { type: 'အလုပ်', coords: targetUserDoc.work }
                ];

                locations.forEach(loc => {
                    if (loc.coords) {
                        const distKm = calculateDistance(userCurrentLat, userCurrentLon, loc.coords.lat, loc.coords.lon);
                        // Within 200 meters radius (0.2 km)
                        if (distKm <= 0.2) {
                            const geofenceKey = `${myName}_at_${targetName}_${loc.type}`;
                            if (!notifiedGeofence[geofenceKey]) {
                                notifiedGeofence[geofenceKey] = true;
                                if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 500]);

                                let message = "";
                                if (myName === 'Rainny') message = `Ko Ko ${loc.type}ရောက်ပါပြီ!`;
                                else if (myName === 'May Thu Hlaing') message = `Mee Mee ${loc.type}ရောက်ပါပြီ!`;
                                else message = `${myName} ${loc.type}သို့ ရောက်ရှိပါပြီ!`;

                                alert(`📍 ${message}`);
                            }
                        }
                    }
                });
            }
        }

        // Firestore Real-time Listener
        function listenToFirestore() {
            onSnapshot(collection(db, "locations"), (snapshot) => {
                let listHTML = '';
                let activeIds = new Set();
                let count = 0;

                snapshot.forEach((docSnap) => {
                    let data = docSnap.data();
                    let id = docSnap.id;
                    activeIds.add(id);
                    count++;

                    if (data.latitude && data.longitude) {
                        const displayName = getDisplayName(data.name, currentUser ? currentUser.name : '');
                        const iconEmoji = data.gender === 'Female' ? '👧' : '👦';

                        const customMarkerIcon = L.divIcon({
                            html: `<div style="font-size: 26px; filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.3));">${iconEmoji}</div>`,
                            className: 'custom-leaflet-marker',
                            iconSize: [30, 30],
                            iconAnchor: [15, 15]
                        });

                        if (markers[id]) {
                            markers[id].setLatLng([data.latitude, data.longitude]);
                        } else {
                            markers[id] = L.marker([data.latitude, data.longitude], { icon: customMarkerIcon })
                                .addTo(map)
                                .bindPopup(`<b>📍 ${displayName}</b><br/><span style="font-size:10px">${data.gender}</span>`);
                        }

                        // Check 500ft (0.1524 km) Proximity
                        if (currentUser && id !== currentUser.name && userCurrentLat && userCurrentLon) {
                            const distanceKm = calculateDistance(userCurrentLat, userCurrentLon, data.latitude, data.longitude);
                            if (distanceKm <= 0.1524) {
                                if (!notifiedProximity[id]) {
                                    notifiedProximity[id] = true;
                                    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
                                    alert(`🔔 ${displayName} သည် သင့်အနီး ပေ ၅၀၀ အတွင်း ရောက်ရှိနေပါပြီ! သိပ်မကြာခင် တွေ့ဆုံတော့မည်ဖြစ်ပါသည်။`);
                                }
                            }
                        }

                        // Check Home/Work Geofence
                        checkGeofenceAlerts(data);

                        const isYou = currentUser && id === currentUser.name;
                        listHTML += `
                            <div class="flex items-center justify-between bg-gray-50 border border-gray-100 p-2.5 rounded-2xl text-xs shadow-sm">
                                <div class="flex items-center gap-2">
                                    <span class="text-base">${iconEmoji}</span>
                                    <span class="font-bold text-gray-700">${displayName} ${isYou ? `<span class="text-pink-600 font-normal">${i18n[currentLang].youTag}</span>` : ''}</span>
                                </div>
                                <button onclick="focusUserAndDrawRoute(${data.latitude}, ${data.longitude}, '${displayName}')" class="bg-pink-600 hover:bg-pink-700 text-white font-bold px-3 py-1 rounded-xl transition shadow-sm">
                                    ${i18n[currentLang].btnView}
                                </button>
                            </div>
                        `;
                    }
                });

                Object.keys(markers).forEach((id) => {
                    if (!activeIds.has(id)) {
                        map.removeLayer(markers[id]);
                        delete markers[id];
                    }
                });

                document.getElementById('userCount').innerText = count;
                document.getElementById('userList').innerHTML = listHTML || `<p class="text-xs text-gray-400 text-center py-4">${i18n[currentLang].searchingUsers}</p>`;
            });
        }

        // Draw Route & Focus User
        window.focusUserAndDrawRoute = function(targetLat, targetLon, label = '') {
            if (!map) return;
            map.flyTo([targetLat, targetLon], 16, { animate: true, duration: 1.5 });

            if (userCurrentLat && userCurrentLon) {
                if (routePolyline) map.removeLayer(routePolyline);

                routePolyline = L.polyline([
                    [userCurrentLat, userCurrentLon],
                    [targetLat, targetLon]
                ], { color: '#ec4899', weight: 4, dashArray: '8, 8' }).addTo(map);

                const distKm = calculateDistance(userCurrentLat, userCurrentLon, targetLat, targetLon);
                const etaMin = Math.round((distKm / 30) * 60);

                document.getElementById('routeDistanceText').innerText = `အကွာအဝေး: ${distKm.toFixed(2)} km`;
                document.getElementById('routeEtaText').innerText = `ကားဖြင့် ခန့်မှန်း ကြာချိန်: ~${etaMin < 1 ? 1 : etaMin} မိနစ်`;
                document.getElementById('routeInfoPanel').classList.remove('hidden');
            }
        };

        window.clearRoute = function() {
            if (routePolyline) {
                map.removeLayer(routePolyline);
                routePolyline = null;
            }
            if (searchMarker) {
                map.removeLayer(searchMarker);
                searchMarker = null;
            }
            document.getElementById('routeInfoPanel').classList.add('hidden');
        };

        // Myanmar Focused Geocoding Search
        window.searchLocation = async function() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=mm`);
                const data = await response.json();

                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);

                    if (searchMarker) map.removeLayer(searchMarker);
                    searchMarker = L.marker([lat, lon]).addTo(map).bindPopup(`<b>📍 ${data[0].display_name}</b>`).openPopup();

                    focusUserAndDrawRoute(lat, lon, data[0].display_name);
                    fetchWeather(lat, lon);
                } else {
                    alert(currentLang === 'my' ? "မြန်မာနိုင်ငံတွင်း နေရာရှာမတွေ့ပါ။ အမည်မှန်အောင် ပြန်ရိုက်ပါ။" : "Location not found in Myanmar.");
                }
            } catch (err) {
                console.error("Search error:", err);
            }
        };

        // Open-Meteo Weather Updates
        async function fetchWeather(lat, lon) {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=temperature_2m,weathercode&forecast_days=1`);
                const data = await res.json();

                if (data && data.current_weather) {
                    const temp = Math.round(data.current_weather.temperature);
                    const code = data.current_weather.weathercode;
                    document.getElementById('weatherTemp').innerText = `${temp}°C`;
                    document.getElementById('weatherDesc').innerText = getWeatherText(code);
                    document.getElementById('weatherIcon').innerText = getWeatherIcon(code);
                    document.getElementById('weatherForecast').innerText = `နောက် ၁ နာရီ: ခန့်မှန်း ${temp}°C ဝန်းကျင်`;
                }
            } catch (err) {
                console.error("Weather error:", err);
            }
        }

        function getWeatherIcon(code) {
            if (code === 0) return '☀️';
            if (code <= 3) return '🌤️';
            if (code <= 48) return '🌫️';
            if (code <= 67) return '🌧️';
            return '⛈️';
        }

        function getWeatherText(code) {
            if (code === 0) return 'သာယာသည်';
            if (code <= 3) return 'တိမ်အနည်းငယ်';
            if (code <= 67) return 'မိုးရွာနိုင်သည်';
            return 'မိုးသက်လေပြင်း';
        }

        // Start Live Location
        function startSharing() {
            if (!navigator.geolocation || !currentUser) return;

            watchId = navigator.geolocation.watchPosition(async (position) => {
                userCurrentLat = position.coords.latitude;
                userCurrentLon = position.coords.longitude;

                document.getElementById('coordsText').innerText = `${userCurrentLat.toFixed(4)}, ${userCurrentLon.toFixed(4)}`;

                await setDoc(doc(db, "locations", currentUser.name), {
                    name: currentUser.name,
                    gender: currentUser.gender,
                    home: currentUser.home || null,
                    work: currentUser.work || null,
                    latitude: userCurrentLat,
                    longitude: userCurrentLon,
                    updatedAt: Date.now()
                });

                fetchWeather(userCurrentLat, userCurrentLon);

            }, (err) => {
                console.error(err);
            }, { enableHighAccuracy: true, timeout: 10000 });

            localStorage.setItem('isSharing', 'true');
            updateUIState();
        }

        function stopSharing() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }
            if (currentUser) {
                deleteDoc(doc(db, "locations", currentUser.name));
            }
            localStorage.setItem('isSharing', 'false');
            document.getElementById('coordsText').innerText = '-, -';
            clearRoute();
            updateUIState();
        }

        window.toggleLocationSharing = function() {
            const isSharing = localStorage.getItem('isSharing') === 'true';
            if (!isSharing) startSharing();
            else stopSharing();
        };

        function updateUIState() {
            const isSharing = localStorage.getItem('isSharing') === 'true';
            const btn = document.getElementById('shareBtn');
            const badge = document.getElementById('statusBadge');

            if (isSharing) {
                btn.innerText = i18n[currentLang].btnStopShare;
                btn.className = "w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-2xl transition duration-200 shadow-md";
                badge.innerText = i18n[currentLang].statusSharing;
                badge.className = "text-xs bg-pink-100 text-pink-700 font-bold px-3 py-1 rounded-full animate-pulse";
            } else {
                btn.innerText = i18n[currentLang].btnStartShare;
                btn.className = "w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-2xl transition duration-200 shadow-md";
                badge.innerText = i18n[currentLang].statusStopped;
                badge.className = "text-xs bg-gray-100 text-gray-500 font-bold px-3 py-1 rounded-full";
            }
        }

        // Floating Hearts Animation Sequence
        window.triggerLoveSurprise = function() {
            document.getElementById('loveModal').classList.remove('hidden');
            const container = document.getElementById('heartContainer');
            const hearts = ['💖', '❤️', '💕', '💗', '💓', '🌸'];

            for (let i = 0; i < 35; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart-particle';
                    heart.innerText = hearts[Math.floor(Math.random() * hearts.length)];
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.animationDuration = (3 + Math.random() * 2) + 's';
                    container.appendChild(heart);
                    setTimeout(() => heart.remove(), 5000);
                }, i * 120);
            }
        };

        window.closeLoveModal = function() {
            document.getElementById('loveModal').classList.add('hidden');
        };

        // Flag Language Switcher Alternating Logic
        window.toggleLanguage = function() {
            currentLang = currentLang === 'my' ? 'en' : 'my';
            localStorage.setItem('appLang', currentLang);
            applyLanguage();
        };

        function applyLanguage() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[currentLang][key]) {
                    el.innerText = i18n[currentLang][key];
                }
            });

            // Alternating Flag Indicator logic
            document.getElementById('flagBtn').innerText = currentLang === 'my' ? '🇬🇧' : '🇲🇲';
            updateUIState();
        }

        // App Entry Point
        window.addEventListener('DOMContentLoaded', () => {
            applyLanguage();
            const savedSession = localStorage.getItem('locationUserSession');
            if (savedSession) {
                currentUser = JSON.parse(savedSession);
                showMapScreen();
            }
        });
    </script>
</body>
</html>
