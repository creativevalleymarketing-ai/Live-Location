<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Live Location</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;700&display=swap');
        body { font-family: 'Pyidaungsu', sans-serif; }
        #map { height: 100%; width: 100%; border-radius: 1.25rem; }
        .color-radio:checked + label {
            ring-width: 3px;
            ring-color: #ec4899;
            transform: scale(1.1);
        }
        .icon-btn.active {
            border-color: #ec4899;
            background-color: #fce7f3;
            color: #be185d;
        }
    </style>
</head>
<body class="bg-pink-50 text-gray-800 min-h-screen flex flex-col justify-between">

    <!-- Top Navigation Bar -->
    <nav class="bg-white/90 backdrop-blur-md border-b border-pink-100 sticky top-0 z-50 px-4 py-3 shadow-sm">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-2xl">📍</span>
                <h1 class="font-bold text-lg text-pink-700 tracking-tight">Live Location</h1>
            </div>
            
            <div class="flex items-center gap-2">
                <!-- Language Switcher -->
                <button onclick="toggleLanguage()" id="langBtn" class="bg-pink-100 text-pink-700 font-bold text-xs px-3 py-1.5 rounded-full border border-pink-200 shadow-sm transition hover:bg-pink-200">
                    🇲🇲 MM | EN
                </button>
                <!-- Logout Button (Only visible when logged in) -->
                <button onclick="logout()" id="logoutBtn" class="hidden text-xs bg-gray-100 hover:bg-gray-200 text-gray-600 px-3 py-1.5 rounded-full font-bold transition">
                    <span data-i18n="logout">ထွက်မည်</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <main class="max-w-md w-full mx-auto p-4 flex-1 flex flex-col justify-center">

        <!-- ================= PAGE 1: LOGIN & CHARACTER CREATOR ================= -->
        <section id="loginScreen" class="bg-white p-6 rounded-3xl shadow-xl border border-pink-100 flex flex-col gap-5 my-auto">
            <div class="text-center">
                <h2 class="text-2xl font-bold text-pink-600" data-i18n="welcomeTitle">အကောင့်ဝင်ပါ</h2>
                <p class="text-xs text-gray-400 mt-1" data-i18n="welcomeSub">Live Location စတင်ရန် အချက်အလက်များ ဖြည့်ပါ</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <!-- Name -->
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1" data-i18n="labelName">အမည်</label>
                    <input type="text" id="inputName" required placeholder="သင့်အမည် ရိုက်ထည့်ပါ" class="w-full px-4 py-3 rounded-2xl bg-gray-50 border border-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-400 text-sm transition">
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-1" data-i18n="labelPassword">လျှို့ဝှက်နံပါတ်</label>
                    <input type="password" id="inputPassword" required placeholder="••••••••" class="w-full px-4 py-3 rounded-2xl bg-gray-50 border border-gray-200 focus:outline-none focus:ring-2 focus:ring-pink-400 text-sm transition">
                </div>

                <!-- Character Icon Selection -->
                <div>
                    <label class="block text-xs font-bold text-gray-600 mb-2" data-i18n="labelCharacter">Icon ရွေးချယ်ရန်</label>
                    <div class="grid grid-cols-3 gap-2" id="roleSelector">
                        <button type="button" onclick="selectRole('Boy')" class="icon-btn active p-2 border border-gray-200 rounded-2xl flex flex-col items-center gap-1 transition">
                            <span class="text-2xl">👦</span>
                            <span class="text-xs font-bold" data-i18n="roleBoy">Boy</span>
                        </button>
                        <button type="button" onclick="selectRole('Girl')" class="icon-btn p-2 border border-gray-200 rounded-2xl flex flex-col items-center gap-1 transition">
                            <span class="text-2xl">👧</span>
                            <span class="text-xs font-bold" data-i18n="roleGirl">Girl</span>
                        </button>
                        <button type="button" onclick="selectRole('Dad')" class="icon-btn p-2 border border-gray-200 rounded-2xl flex flex-col items-center gap-1 transition">
                            <span class="text-2xl">👨</span>
                            <span class="text-xs font-bold" data-i18n="roleDad">Dad</span>
                        </button>
                        <button type="button" onclick="selectRole('Mom')" class="icon-btn p-2 border border-gray-200 rounded-2xl flex flex-col items-center gap-1 transition">
                            <span class="text-2xl">👩</span>
                            <span class="text-xs font-bold" data-i18n="roleMom">Mom</span>
                        </button>
                        <button type="button" onclick="selectRole('Uncle')" class="icon-btn p-2 border border-gray-200 rounded-2xl flex flex-col items-center gap-1 transition">
                            <span class="text-2xl">🧔</span>
                            <span class="text-xs font-bold" data-i18n="roleUncle">Uncle</span>
                        </button>
                        <button type="button" onclick="selectRole('Aunty')" class="icon-btn p-2 border border-gray-200 rounded-2xl flex flex-col items-center gap-1 transition">
                            <span class="text-2xl">👵</span>
                            <span class="text-xs font-bold" data-i18n="roleAunty">Aunty</span>
                        </button>
                    </div>
                </div>

                <!-- Color Customization -->
                <div class="bg-pink-50/50 p-3 rounded-2xl border border-pink-100 space-y-3">
                    <!-- Hair Color -->
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-gray-600" data-i18n="hairColor">ဆံပင် အရောင်</span>
                        <div class="flex gap-2">
                            <input type="color" id="hairColor" value="#4a3728" class="w-7 h-7 rounded-full border-0 cursor-pointer bg-transparent">
                        </div>
                    </div>
                    <!-- Top Color -->
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-gray-600" data-i18n="topColor">အင်္ကျီ အရောင်</span>
                        <div class="flex gap-2">
                            <input type="color" id="topColor" value="#ec4899" class="w-7 h-7 rounded-full border-0 cursor-pointer bg-transparent">
                        </div>
                    </div>
                    <!-- Bottom Color -->
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold text-gray-600" data-i18n="bottomColor">ဘောင်းဘီ/စကပ်</span>
                        <div class="flex gap-2">
                            <input type="color" id="bottomColor" value="#1e3a8a" class="w-7 h-7 rounded-full border-0 cursor-pointer bg-transparent">
                        </div>
                    </div>
                </div>

                <!-- Live Character Preview -->
                <div class="flex items-center justify-center p-2 bg-gray-50 rounded-2xl border border-dashed border-gray-300">
                    <div id="characterPreview" class="w-16 h-16 flex items-center justify-center"></div>
                </div>

                <button type="submit" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-2xl transition duration-200 shadow-lg shadow-pink-200" data-i18n="btnLogin">
                    အကောင့်ဝင်မည်
                </button>
            </form>
        </section>


        <!-- ================= PAGE 2: MAP & LIVE LOCATION ================= -->
        <section id="mapScreen" class="hidden flex flex-col gap-4">
            
            <!-- User Status Card -->
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-pink-100 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div id="userAvatarContainer" class="w-10 h-10 rounded-full bg-pink-100 flex items-center justify-between overflow-hidden p-1 border border-pink-200"></div>
                    <div>
                        <h3 id="displayUserName" class="font-bold text-sm text-gray-800">User</h3>
                        <p id="displayUserRole" class="text-xs text-pink-600 font-medium">Boy</p>
                    </div>
                </div>
                <div id="statusBadge" class="text-xs bg-gray-100 text-gray-500 font-bold px-3 py-1 rounded-full">
                    <span data-i18n="statusStopped">ရပ်တန့်ထားသည်</span>
                </div>
            </div>

            <!-- Map Area -->
            <div class="bg-white p-3 rounded-3xl shadow-md border border-pink-100 flex flex-col gap-3">
                <div class="h-80 relative overflow-hidden rounded-2xl shadow-inner">
                    <div id="map"></div>
                </div>

                <div class="bg-pink-50 p-3 rounded-2xl text-xs space-y-1">
                    <div class="flex justify-between text-gray-600">
                        <span data-i18n="coordinates">တည်နေရာ (Lat, Lon):</span>
                        <span id="coordsText" class="font-mono font-bold text-gray-800">-, -</span>
                    </div>
                </div>

                <button onclick="toggleLocationSharing()" id="shareBtn" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-2xl transition duration-200 shadow-md">
                    <span data-i18n="btnStartShare">Live Location စတင်မျှဝေမည်</span>
                </button>
            </div>

            <!-- Active Users List -->
            <div class="bg-white p-4 rounded-3xl shadow-md border border-pink-100">
                <h3 class="font-bold text-sm text-gray-700 mb-3 flex items-center justify-between">
                    <span data-i18n="activeUsersTitle">👥 Map ပေါ်ရှိ သုံးစွဲသူများ</span>
                    <span id="userCount" class="bg-pink-100 text-pink-700 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
                </h3>
                <div id="userList" class="space-y-2 max-h-48 overflow-y-auto pr-1">
                    <p class="text-xs text-gray-400 text-center py-4" data-i18n="searchingUsers">သုံးစွဲသူများ မရှိသေးပါ။</p>
                </div>
            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer class="text-center py-3 text-xs text-gray-400">
        Firebase Live Location &copy; 2026
    </footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDLG2fJ3fRtBNNO0DhhRFbZoFdDGPRExn0",
            authDomain: "live-location-ea2df.firebaseapp.com",
            projectId: "live-location-ea2df",
            storageBucket: "live-location-ea2df.firebasestorage.app",
            messagingSenderId: "891244033984",
            appId: "1:891244033984:web:8e5ab090301d9f002cfa25",
            measurementId: "G-KVR7ZEFW1H"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // State Variables
        let currentLang = localStorage.getItem('appLang') || 'my';
        let selectedRole = 'Boy';
        let watchId = null;
        let map = null;
        let markers = {};
        let currentUser = null;

        // Language Dictionary
        const i18n = {
            my: {
                logout: "ထွက်မည်",
                welcomeTitle: "အကောင့်ဝင်ပါ",
                welcomeSub: "Live Location စတင်ရန် အချက်အလက်များ ဖြည့်ပါ",
                labelName: "အမည်",
                labelPassword: "လျှို့ဝှက်နံပါတ်",
                labelCharacter: "Icon ရွေးချယ်ရန်",
                roleBoy: "Boy",
                roleGirl: "Girl",
                roleDad: "Dad",
                roleMom: "Mom",
                roleUncle: "Uncle",
                roleAunty: "Aunty",
                hairColor: "ဆံပင် အရောင်",
                topColor: "အင်္ကျီ အရောင်",
                bottomColor: "ဘောင်းဘီ/စကပ်",
                btnLogin: "အကောင့်ဝင်မည်",
                statusStopped: "ရပ်တန့်ထားသည်",
                statusSharing: "Live Location မျှဝေနေသည်",
                coordinates: "တည်နေရာ (Lat, Lon):",
                btnStartShare: "Live Location စတင်မျှဝေမည်",
                btnStopShare: "Live Location မျှဝေမှု ရပ်မည်",
                activeUsersTitle: "👥 Map ပေါ်ရှိ သုံးစွဲသူများ",
                searchingUsers: "သုံးစွဲသူများ မရှိသေးပါ။",
                btnView: "ကြည့်မည်",
                youTag: "(မိမိ)"
            },
            en: {
                logout: "Logout",
                welcomeTitle: "Welcome",
                welcomeSub: "Fill details to start Live Location",
                labelName: "Name",
                labelPassword: "Password",
                labelCharacter: "Select Icon",
                roleBoy: "Boy",
                roleGirl: "Girl",
                roleDad: "Dad",
                roleMom: "Mom",
                roleUncle: "Uncle",
                roleAunty: "Aunty",
                hairColor: "Hair Color",
                topColor: "Top Color",
                bottomColor: "Bottom/Skirt",
                btnLogin: "Login",
                statusStopped: "Stopped",
                statusSharing: "Sharing Live Location",
                coordinates: "Coords (Lat, Lon):",
                btnStartShare: "Start Live Location",
                btnStopShare: "Stop Live Location",
                activeUsersTitle: "👥 Active Users on Map",
                searchingUsers: "No active users.",
                btnView: "View",
                youTag: "(You)"
            }
        };

        // Icon SVG Generator Helper
        function generateAvatarSVG(role, hair, top, bottom, size = 48) {
            const emojis = { Boy: '👦', Girl: '👧', Dad: '👨', Mom: '👩', Uncle: '🧔', Aunty: '👵' };
            const emoji = emojis[role] || '👦';
            
            return `
                <svg width="${size}" height="${size}" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
                    <!-- Background Circle / Bottom Color -->
                    <circle cx="32" cy="32" r="30" fill="${bottom}" stroke="${top}" stroke-width="3"/>
                    
                    <!-- Top Color Accent Ring -->
                    <circle cx="32" cy="32" r="24" fill="${top}" opacity="0.3"/>
                    
                    <!-- Hair Accent Backdrop -->
                    <circle cx="32" cy="18" r="10" fill="${hair}" opacity="0.4"/>
                    
                    <!-- Role Emoji Avatar Center -->
                    <text x="32" y="42" font-size="28" text-anchor="middle" dominant-baseline="middle">${emoji}</text>
                </svg>
            `;
        }

        // Hash Password for Document ID
        async function hashPassword(str) {
            const encoder = new TextEncoder();
            const data = encoder.encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('').substring(0, 16);
        }

        // Global Role Selector
        window.selectRole = function(role) {
            selectedRole = role;
            document.querySelectorAll('#roleSelector .icon-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            updatePreview();
        };

        function updatePreview() {
            const hair = document.getElementById('hairColor').value;
            const top = document.getElementById('topColor').value;
            const bottom = document.getElementById('bottomColor').value;
            document.getElementById('characterPreview').innerHTML = generateAvatarSVG(selectedRole, hair, top, bottom, 56);
        }

        document.getElementById('hairColor').addEventListener('input', updatePreview);
        document.getElementById('topColor').addEventListener('input', updatePreview);
        document.getElementById('bottomColor').addEventListener('input', updatePreview);

        // Language Switcher
        window.toggleLanguage = function() {
            currentLang = currentLang === 'my' ? 'en' : 'my';
            localStorage.setItem('appLang', currentLang);
            applyLanguage();
        };

        function applyLanguage() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[currentLang][key]) {
                    el.innerText = i18n[currentLang][key];
                }
            });
            document.getElementById('langBtn').innerText = currentLang === 'my' ? '🇲🇲 MM | EN' : '🇬🇧 EN | MM';
            updateUIState();
        }

        // Handle Login Submission
        window.handleLogin = async function(e) {
            e.preventDefault();
            const name = document.getElementById('inputName').value.trim();
            const pass = document.getElementById('inputPassword').value.trim();
            
            if (!name || !pass) return;

            const userId = 'user_' + await hashPassword(pass);
            const hair = document.getElementById('hairColor').value;
            const top = document.getElementById('topColor').value;
            const bottom = document.getElementById('bottomColor').value;

            currentUser = {
                id: userId,
                name: name,
                role: selectedRole,
                hairColor: hair,
                topColor: top,
                bottomColor: bottom
            };

            localStorage.setItem('locationUserSession', JSON.stringify(currentUser));
            showMapScreen();
        };

        // Screen Navigation
        function showMapScreen() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mapScreen').classList.remove('hidden');
            document.getElementById('logoutBtn').classList.remove('hidden');

            document.getElementById('displayUserName').innerText = currentUser.name;
            document.getElementById('displayUserRole').innerText = currentUser.role;
            document.getElementById('userAvatarContainer').innerHTML = generateAvatarSVG(
                currentUser.role, currentUser.hairColor, currentUser.topColor, currentUser.bottomColor, 36
            );

            initMap();
            listenToFirestore();

            // Auto-resume sharing if active before
            if (localStorage.getItem('isSharing') === 'true') {
                startSharing();
            }
        }

        window.logout = function() {
            stopSharing();
            localStorage.removeItem('locationUserSession');
            localStorage.removeItem('isSharing');
            currentUser = null;

            document.getElementById('mapScreen').classList.add('hidden');
            document.getElementById('logoutBtn').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
        };

        // Initialize Leaflet Map
        function initMap() {
            if (map) return;
            map = L.map('map').setView([16.8661, 96.1951], 13);
            L.tileLayer('https://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}', {
                maxZoom: 20,
                subdomains: ['mt0', 'mt1', 'mt2', 'mt3'],
                attribution: '© Google Maps'
            }).addTo(map);
        }

        // Firestore Real-time Listener (Stop မနှိပ်မချင်း Marker ပျောက်မည်မဟုတ်ပါ)
        function listenToFirestore() {
            onSnapshot(collection(db, "locations"), (snapshot) => {
                let listHTML = '';
                let activeIds = new Set();
                let count = 0;

                snapshot.forEach((docSnap) => {
                    let data = docSnap.data();
                    let id = docSnap.id;
                    activeIds.add(id);
                    count++;

                    if (data.latitude && data.longitude) {
                        const iconSVG = generateAvatarSVG(data.role, data.hairColor, data.topColor, data.bottomColor, 40);
                        const customMarkerIcon = L.divIcon({
                            html: iconSVG,
                            className: 'custom-leaflet-marker',
                            iconSize: [40, 40],
                            iconAnchor: [20, 20]
                        });

                        if (markers[id]) {
                            markers[id].setLatLng([data.latitude, data.longitude]);
                            markers[id].setIcon(customMarkerIcon);
                        } else {
                            markers[id] = L.marker([data.latitude, data.longitude], { icon: customMarkerIcon })
                                .addTo(map)
                                .bindPopup(`<b>📍 ${data.name}</b><br/><span style="font-size:10px">${data.role}</span>`);
                        }

                        const isYou = currentUser && id === currentUser.id;
                        listHTML += `
                            <div class="flex items-center justify-between bg-gray-50 border border-gray-100 p-2.5 rounded-2xl text-xs shadow-sm">
                                <div class="flex items-center gap-2">
                                    <div class="w-7 h-7 flex items-center justify-center">${iconSVG}</div>
                                    <span class="font-bold text-gray-700">${data.name} ${isYou ? `<span class="text-pink-600 font-normal">${i18n[currentLang].youTag}</span>` : ''}</span>
                                </div>
                                <button onclick="focusOnUser(${data.latitude}, ${data.longitude})" class="bg-pink-600 hover:bg-pink-700 text-white font-bold px-3 py-1 rounded-xl transition shadow-sm">
                                    ${i18n[currentLang].btnView}
                                </button>
                            </div>
                        `;
                    }
                });

                // Delete Marker ONLY when Document is explicitly removed via Stop or Logout
                Object.keys(markers).forEach((id) => {
                    if (!activeIds.has(id)) {
                        map.removeLayer(markers[id]);
                        delete markers[id];
                    }
                });

                document.getElementById('userCount').innerText = count;
                document.getElementById('userList').innerHTML = listHTML || `<p class="text-xs text-gray-400 text-center py-4">${i18n[currentLang].searchingUsers}</p>`;
            });
        }

        // View Button Camera Fly-to Location
        window.focusOnUser = function(lat, lon) {
            if (map) {
                map.flyTo([lat, lon], 16, { animate: true, duration: 1.5 });
            }
        };

        // Start Live Location Sharing
        function startSharing() {
            if (!navigator.geolocation || !currentUser) return;

            watchId = navigator.geolocation.watchPosition(async (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                document.getElementById('coordsText').innerText = `${lat.toFixed(4)}, ${lon.toFixed(4)}`;

                // Save to Firestore Database
                await setDoc(doc(db, "locations", currentUser.id), {
                    name: currentUser.name,
                    role: currentUser.role,
                    hairColor: currentUser.hairColor,
                    topColor: currentUser.topColor,
                    bottomColor: currentUser.bottomColor,
                    latitude: lat,
                    longitude: lon,
                    updatedAt: Date.now()
                });

            }, (error) => {
                console.error("Geolocation error:", error);
            }, {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 10000
            });

            localStorage.setItem('isSharing', 'true');
            updateUIState();
        }

        // Stop Live Location Sharing
        function stopSharing() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
            }

            if (currentUser) {
                deleteDoc(doc(db, "locations", currentUser.id));
            }

            localStorage.setItem('isSharing', 'false');
            document.getElementById('coordsText').innerText = '-, -';
            updateUIState();
        }

        window.toggleLocationSharing = function() {
            const isSharing = localStorage.getItem('isSharing') === 'true';
            if (!isSharing) {
                startSharing();
            } else {
                stopSharing();
            }
        };

        function updateUIState() {
            const isSharing = localStorage.getItem('isSharing') === 'true';
            const btn = document.getElementById('shareBtn');
            const badge = document.getElementById('statusBadge');

            if (isSharing) {
                btn.innerText = i18n[currentLang].btnStopShare;
                btn.className = "w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-2xl transition duration-200 shadow-md";
                badge.innerText = i18n[currentLang].statusSharing;
                badge.className = "text-xs bg-pink-100 text-pink-700 font-bold px-3 py-1 rounded-full animate-pulse";
            } else {
                btn.innerText = i18n[currentLang].btnStartShare;
                btn.className = "w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-2xl transition duration-200 shadow-md";
                badge.innerText = i18n[currentLang].statusStopped;
                badge.className = "text-xs bg-gray-100 text-gray-500 font-bold px-3 py-1 rounded-full";
            }
        }

        // App Initialization
        window.addEventListener('DOMContentLoaded', () => {
            updatePreview();
            applyLanguage();

            const savedSession = localStorage.getItem('locationUserSession');
            if (savedSession) {
                currentUser = JSON.parse(savedSession);
                showMapScreen();
            }
        });
    </script>
</body>
</html>
